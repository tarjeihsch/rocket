stages:
  - build

build-all:
  stage: build
  image: gitlab.bitmaskentertainment.com:5050/bitmask-entertainment/rocket:latest
  parallel:
    matrix:
      - PRESET: gcc-debug
      - PRESET: clang-debug
      - PRESET: mingw-debug
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libxcursor-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev libxkbcommon-dev mesa-common-dev libgl1-mesa-dev libwayland-dev wayland-protocols

  script:
    - cmake --preset $PRESET
    - cmake --build --preset $PRESET
