stages:
  - build

build-all:
  stage: build
  image: gitlab.bitmaskentertainment.com:5050/bitmask-entertainment/rocket:latest
  parallel:
    matrix:
      - PRESET: gcc-debug
      - PRESET: clang-debug
      - PRESET: mingw-debug
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libxcursor-dev

  script:
    - cmake --preset $PRESET
    - cmake --build --preset $PRESET
