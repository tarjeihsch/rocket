stages:
  - build

build-gcc:
  stage: build
  image: gitlab.bitmaskentertainment.com:5050/bitmask-entertainment/default:latest
  tags: ["default"]
  parallel:
    matrix:
      - PRESET: gcc-debug
      - PRESET: clang-debug
  script:
    - cmake --preset $PRESET
    - cmake --build --preset $PRESET
